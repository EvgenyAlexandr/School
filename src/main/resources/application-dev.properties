# ===== \u041D\u0410\u0421\u0422\u0420\u041E\u0419\u041A\u0418 \u0420\u0410\u0417\u0420\u0410\u0411\u041E\u0422\u041A\u0418 (DEVELOPMENT) =====
# \u041F\u043E\u0440\u0442 \u0434\u043B\u044F \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u043A\u0438
server.port=8081

# \u0411\u0430\u0437\u0430 \u0434\u0430\u043D\u043D\u044B\u0445 H2 \u0434\u043B\u044F \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u043A\u0438 (\u0432 \u043F\u0430\u043C\u044F\u0442\u0438)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# \u0421\u043E\u0437\u0434\u0430\u0432\u0430\u0442\u044C/\u0443\u0434\u0430\u043B\u044F\u0442\u044C \u0441\u0445\u0435\u043C\u0443 \u043F\u0440\u0438 \u0437\u0430\u043F\u0443\u0441\u043A\u0435/\u043E\u0441\u0442\u0430\u043D\u043E\u0432\u043A\u0435
spring.jpa.hibernate.ddl-auto=create-drop

# \u0414\u0438\u0430\u043B\u0435\u043A\u0442 \u0434\u043B\u044F H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# \u041F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u0442\u044C SQL \u0437\u0430\u043F\u0440\u043E\u0441\u044B \u0432 \u043B\u043E\u0433\u0430\u0445
spring.jpa.show-sql=true

# \u0412\u043A\u043B\u044E\u0447\u0438\u0442\u044C \u043A\u043E\u043D\u0441\u043E\u043B\u044C H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# \u041F\u043E\u0434\u0440\u043E\u0431\u043D\u043E\u0435 \u043B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u0434\u043B\u044F \u043E\u0442\u043B\u0430\u0434\u043A\u0438
logging.level.ru.hogwarts.school=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE

# \u0421\u043E\u043E\u0431\u0449\u0435\u043D\u0438\u0435 \u043F\u043E\u0440\u0442\u0430 (\u0434\u043B\u044F GET /port \u044D\u043D\u0434\u043F\u043E\u0438\u043D\u0442\u0430)
app.port.message=Development server running on port 8081