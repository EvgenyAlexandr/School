# \u041D\u0430\u0437\u0432\u0430\u043D\u0438\u0435 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F
spring.application.name=school

# \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u044F \u043A PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hogwarts
spring.datasource.username=student
spring.datasource.password=chocolatefrog

# \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 Hibernate \u0434\u043B\u044F \u0440\u0430\u0431\u043E\u0442\u044B \u0441 \u0411\u0414 (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update

# \u041F\u0443\u0442\u044C \u0434\u043B\u044F \u0441\u043E\u0445\u0440\u0430\u043D\u0435\u043D\u0438\u044F \u0444\u0430\u0439\u043B\u043E\u0432 \u0430\u0432\u0430\u0442\u0430\u0440\u043E\u0432
path.to.avatars.folder=/avatars

# \u041F\u0443\u0442\u044C \u043A \u0444\u0430\u0439\u043B\u0443 \u043A\u043E\u043D\u0444\u0438\u0433\u0443\u0440\u0430\u0446\u0438\u0438 Liquibase
spring.liquibase.change-log=classpath:liquibase/changelog-master.yml

# \u041F\u043E\u0440\u0442 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F
server.port=8080

# \u0423\u0440\u043E\u0432\u0435\u043D\u044C \u043B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F \u0434\u043B\u044F \u0432\u0441\u0435\u0445 \u043B\u043E\u0433\u0433\u0435\u0440\u043E\u0432
logging.level.root=INFO

# \u0423\u0440\u043E\u0432\u043D\u0438 \u043B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F \u0434\u043B\u044F \u0441\u0435\u0440\u0432\u0438\u0441\u043E\u0432
logging.level.ru.hogwarts.school.service.AvatarService=DEBUG
logging.level.ru.hogwarts.school.service.FacultyService=DEBUG
logging.level.ru.hogwarts.school.service.StudentService=DEBUG

logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# \u0424\u043E\u0440\u043C\u0430\u0442 \u0432\u044B\u0432\u043E\u0434\u0430 \u043B\u043E\u0433\u043E\u0432 \u0432 \u043A\u043E\u043D\u0441\u043E\u043B\u044C
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u0444\u0430\u0439\u043B\u043E\u0432\u043E\u0433\u043E \u043B\u043E\u0433\u0433\u0435\u0440\u0430
logging.file.name=logs/hogwarts.log
logging.file.max-size=10MB
logging.file.max-history=20



