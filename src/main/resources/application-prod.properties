# ===== \u041D\u0410\u0421\u0422\u0420\u041E\u0419\u041A\u0418 \u041F\u0420\u041E\u0414\u0410\u041A\u0428\u0415\u041D\u0410 (PRODUCTION) =====
# \u041F\u043E\u0440\u0442 \u0434\u043B\u044F \u043F\u0440\u043E\u0434\u0430\u043A\u0448\u0435\u043D\u0430
server.port=8080

# PostgreSQL \u0434\u043B\u044F \u043F\u0440\u043E\u0434\u0430\u043A\u0448\u0435\u043D\u0430
spring.datasource.url=jdbc:postgresql://localhost:5432/hogwarts_prod
spring.datasource.username=admin
spring.datasource.password=secure_password_123

# \u0422\u043E\u043B\u044C\u043A\u043E \u0432\u0430\u043B\u0438\u0434\u0430\u0446\u0438\u044F \u0441\u0445\u0435\u043C\u044B (\u043D\u0435 \u0438\u0437\u043C\u0435\u043D\u044F\u0442\u044C \u0441\u0442\u0440\u0443\u043A\u0442\u0443\u0440\u0443 \u0411\u0414)
spring.jpa.hibernate.ddl-auto=validate

# \u0414\u0438\u0430\u043B\u0435\u043A\u0442 \u0434\u043B\u044F PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# \u041D\u0435 \u043F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u0442\u044C SQL \u0432 \u043B\u043E\u0433\u0430\u0445
spring.jpa.show-sql=false

# \u041C\u0438\u043D\u0438\u043C\u0430\u043B\u044C\u043D\u043E\u0435 \u043B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u0432 \u043F\u0440\u043E\u0434\u0430\u043A\u0448\u0435\u043D\u0435
logging.level.ru.hogwarts.school=INFO
logging.level.org.hibernate=WARN

# \u0421\u043E\u043E\u0431\u0449\u0435\u043D\u0438\u0435 \u043F\u043E\u0440\u0442\u0430 (\u0434\u043B\u044F GET /port \u044D\u043D\u0434\u043F\u043E\u0438\u043D\u0442\u0430)
app.port.message=Production server running on port 8080