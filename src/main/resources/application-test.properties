# ===== \u041D\u0410\u0421\u0422\u0420\u041E\u0419\u041A\u0418 \u0422\u0415\u0421\u0422\u0418\u0420\u041E\u0412\u0410\u041D\u0418\u042F =====
# \u041F\u043E\u0440\u0442 \u0434\u043B\u044F \u0442\u0435\u0441\u0442\u043E\u0432
server.port=8082

# \u0411\u0430\u0437\u0430 \u0434\u0430\u043D\u043D\u044B\u0445 H2 \u0434\u043B\u044F \u0442\u0435\u0441\u0442\u043E\u0432
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
# \u0423\u0447\u0435\u0442\u043D\u044B\u0435 \u0434\u0430\u043D\u043D\u044B\u0435 \u0434\u043B\u044F \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u044F \u043A H2
spring.datasource.username=sa
spring.datasource.password=

# \u0421\u043E\u0437\u0434\u0430\u0432\u0430\u0442\u044C \u0441\u0445\u0435\u043C\u0443 \u0434\u043B\u044F \u0442\u0435\u0441\u0442\u043E\u0432
spring.jpa.hibernate.ddl-auto=create-drop

# \u0414\u0438\u0430\u043B\u0435\u043A\u0442 \u0434\u043B\u044F H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# \u041E\u0442\u043E\u0431\u0440\u0430\u0436\u0435\u043D\u0438\u0435 SQL \u0437\u0430\u043F\u0440\u043E\u0441\u043E\u0432 \u0432 \u043A\u043E\u043D\u0441\u043E\u043B\u0438 (\u0434\u043B\u044F \u043E\u0442\u043B\u0430\u0434\u043A\u0438)
spring.jpa.show-sql=true

# \u041E\u0442\u043A\u043B\u044E\u0447\u0438\u0442\u044C Liquibase \u0432 \u0442\u0435\u0441\u0442\u0430\u0445 - \u0421\u043E\u0437\u0434\u0430\u043D\u0438\u0435 \u0438\u043D\u0434\u0435\u043A\u0441\u043E\u0432
spring.liquibase.enabled=false

# \u0421\u043E\u043E\u0431\u0449\u0435\u043D\u0438\u0435 \u043F\u043E\u0440\u0442\u0430
app.port.message=Test server running on port 8082

# \u041E\u0442\u043A\u043B\u044E\u0447\u0430\u0435\u043C \u0432\u0435\u0431-\u0438\u043D\u0442\u0435\u0440\u0444\u0435\u0439\u0441 H2 \u0434\u043B\u044F \u0442\u0435\u0441\u0442\u043E\u0432
spring.h2.console.enabled=false